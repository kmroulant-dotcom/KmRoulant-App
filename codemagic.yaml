workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple API Key          # nom exact de la clé API dans Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kmroulant.KmRoulant   # ton vrai bundle id
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/ReactKmRoulant.xcworkspace"
        XCODE_SCHEME: "ReactKmRoulant"
        APP_STORE_APPLE_ID: 6760676444          # Apple ID numérique de l'app

    scripts:
      - name: Install dependencies
        script: |
          npm ci

      - name: Install CocoaPods
        script: |
          cd ios && pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $((LATEST + 1))

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true